name: engine · Azure deploy

# Split into:
#   * `dev` — auto-deploys every push to main that touches engine/* (no
#     manual approval, but still routed through the `dev` GitHub Environment
#     so deploy secrets stay scoped).
#   * `prod` — gated by the `prod` GitHub Environment which holds the
#     required-reviewers protection (see .github/environments/prod.json).
#     Reviewer approval triggers the same Bicep, with prod params, plus a
#     post-deploy smoke (healthz + Keycloak token + /v1/themes).

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment (dev / prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
      image_tag:
        description: 'Image tag (defaults to commit SHA)'
        required: false
  push:
    branches: [main]
    paths:
      - 'engine/crates/**'
      - 'engine/scripts/**'
      - 'engine/themes/**'
      - 'engine/infra/**'
      - 'engine/Cargo.toml'
      - 'engine/Cargo.lock'
      - '.github/workflows/azure-deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

jobs:
  # --------------------------------------------------------------------------
  # Shared image build — runs once per workflow, reused by dev + prod.
  # We use ACR Build (server-side) so we don't need a local Docker daemon.
  # --------------------------------------------------------------------------
  build-images:
    name: build · ACR images
    runs-on: ubuntu-latest
    environment: dev # reuse dev creds for the build, prod deploy re-runs against prod RG
    timeout-minutes: 30
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
      skip: ${{ steps.preflight.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Pre-flight: validate that the AZURE_* secrets exist AND that the
      # Entra app registration has a federated credential for this repo +
      # environment. The latter cannot be checked from inside the job
      # (it requires Microsoft Graph access), so we proxy via the actual
      # azure/login step: if it fails with AADSTS700213 the deploy is
      # blocked on a one-time Entra portal step the maintainer must run.
      #
      # Setup recipe (run once per environment, dev + prod):
      #   az ad app federated-credential create --id <APP_OBJECT_ID> \
      #     --parameters '{
      #       "name": "github-stonyp90-motion-dev",
      #       "issuer": "https://token.actions.githubusercontent.com",
      #       "subject": "repo:stonyp90/motion:environment:dev",
      #       "audiences": ["api://AzureADTokenExchange"]
      #     }'
      #
      # See docs/runbooks/security.md → "Azure OIDC federated identity"
      # for the full walkthrough including the prod variant.
      # ----------------------------------------------------------------------
      - name: Pre-flight (AZURE_* secrets present)
        id: secrets
        env:
          AZURE_CLIENT_ID:        ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID:        ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID:  ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [[ -z "$AZURE_CLIENT_ID" || -z "$AZURE_TENANT_ID" || -z "$AZURE_SUBSCRIPTION_ID" ]]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AZURE_* secrets missing; skipping Azure deploy."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/login@v2
        if: steps.secrets.outputs.ok == 'true'
        # AADSTS700213 → missing federated credential in Entra for this
        # repo+env subject. continue-on-error keeps the run amber rather
        # than red; the `gate` step below merges secret + login state
        # into a single `skip` output the downstream jobs read.
        continue-on-error: true
        id: login
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute final skip flag
        id: preflight
        run: |
          if [[ "${{ steps.secrets.outputs.ok }}" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.login.outcome }}" == "failure" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::azure/login failed — likely missing OIDC federated credential for repo:stonyp90/motion:environment:dev. See docs/runbooks/security.md → 'Azure OIDC federated identity'."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve dev ACR (image registry)
        if: steps.preflight.outputs.skip != 'true'
        id: discover
        run: |
          RG="rg-motion-forge-dev"
          ACR=$(az acr list --resource-group "${RG}" --query "[0].name" -o tsv)
          if [[ -z "${ACR}" ]]; then
            echo "no ACR in ${RG}; bootstrap with: cd engine/infra && ./deploy.sh --env dev" >&2
            exit 1
          fi
          echo "rg=${RG}"   >> "$GITHUB_OUTPUT"
          echo "acr=${ACR}" >> "$GITHUB_OUTPUT"

      - name: Build + push images via ACR Build
        if: steps.preflight.outputs.skip != 'true'
        run: |
          # API image (Rust) — slow build, ~6 min on ACR
          az acr build --registry ${{ steps.discover.outputs.acr }} \
            --image "motion-forge-api:${IMAGE_TAG}" \
            --image "motion-forge-api:latest" \
            --file engine/infra/docker/Dockerfile.api \
            --platform linux/amd64 \
            engine
          # Render job (Python + Lottie). Skip the segment image when
          # enableGpuProfile=false on the target env.
          az acr build --registry ${{ steps.discover.outputs.acr }} \
            --image "motion-forge-render:${IMAGE_TAG}" \
            --image "motion-forge-render:latest" \
            --file engine/infra/docker/Dockerfile.render \
            --platform linux/amd64 \
            engine
          # Keycloak with realm export baked in. Two-stage `kc.sh build`
          # pre-compiles the Postgres driver so first-boot startup
          # drops from ~60s to ~10s.
          az acr build --registry ${{ steps.discover.outputs.acr }} \
            --image "controlcraft-keycloak:${IMAGE_TAG}" \
            --image "controlcraft-keycloak:latest" \
            --file engine/infra/docker/Dockerfile.keycloak \
            --platform linux/amd64 \
            engine

  # --------------------------------------------------------------------------
  # Dev — auto on main, no manual approval. The `dev` GitHub Environment
  # carries the dev-only AZURE_* secrets, scoped to that environment.
  # --------------------------------------------------------------------------
  deploy-dev:
    name: deploy · dev
    needs: build-images
    if: |
      needs.build-images.outputs.skip != 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.env == 'dev'))
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.summary.outputs.url }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply Bicep (dev)
        run: |
          az deployment group create \
            --resource-group "rg-motion-forge-dev" \
            --template-file engine/infra/main.bicep \
            --parameters "engine/infra/parameters.dev.bicepparam" \
            --parameters "apiImageTag=${IMAGE_TAG}" "renderImageTag=${IMAGE_TAG}" "keycloakImageTag=${IMAGE_TAG}" \
            --parameters "keycloakAdminPassword=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --query "properties.provisioningState" -o tsv

      - name: Print Front Door endpoint
        id: summary
        run: |
          FD_PROFILE=$(az afd profile list -g "rg-motion-forge-dev" --query '[0].name' -o tsv)
          FD=$(az afd endpoint list --profile-name "$FD_PROFILE" -g "rg-motion-forge-dev" --query '[0].hostName' -o tsv)
          echo "url=https://${FD}" >> "$GITHUB_OUTPUT"
          {
            echo "## motion · dev deploy"
            echo "* Image tag: \`${IMAGE_TAG}\`"
            echo "* Front Door: https://${FD}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post-deploy smoke (dev)
        run: |
          FD_PROFILE=$(az afd profile list -g "rg-motion-forge-dev" --query '[0].name' -o tsv)
          FD=$(az afd endpoint list --profile-name "$FD_PROFILE" -g "rg-motion-forge-dev" --query '[0].hostName' -o tsv)
          # Light smoke for dev — just healthz, since dev params may have
          # auth disabled or Keycloak in a degraded state.
          for _i in $(seq 1 20); do
            if curl -sf "https://${FD}/healthz" >/dev/null; then
              echo "dev healthz ok"; exit 0
            fi
            sleep 5
          done
          echo "::error::dev healthz failed after retries"
          exit 1

  # --------------------------------------------------------------------------
  # Prod — gated by the `prod` GitHub Environment + required reviewers
  # (configured in .github/environments/prod.json and synced to GitHub via
  # the API / Terraform). Reviewer approval is what releases this job.
  #
  # Triggers:
  #   * Manual workflow_dispatch with env=prod  → primary path
  #   * Pushes to main do NOT auto-promote — prod stays manual on purpose.
  # --------------------------------------------------------------------------
  deploy-prod:
    name: deploy · prod (approval required)
    needs: build-images
    if: |
      needs.build-images.outputs.skip != 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.env == 'prod'
    runs-on: ubuntu-latest
    environment:
      # `name: prod` is what binds this job to the `prod` Environment in
      # GitHub; that Environment carries the required-reviewers rule,
      # wait timer, and prod-only secrets. Without approval, this job
      # sits in `waiting` and never executes.
      name: prod
      url: ${{ steps.summary.outputs.url }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply Bicep (prod)
        run: |
          az deployment group create \
            --resource-group "rg-motion-forge-prod" \
            --template-file engine/infra/main.bicep \
            --parameters "engine/infra/parameters.prod.bicepparam" \
            --parameters "apiImageTag=${IMAGE_TAG}" "renderImageTag=${IMAGE_TAG}" "keycloakImageTag=${IMAGE_TAG}" \
            --parameters "keycloakAdminPassword=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --query "properties.provisioningState" -o tsv

      - name: Resolve prod Front Door endpoint
        id: summary
        run: |
          FD_PROFILE=$(az afd profile list -g "rg-motion-forge-prod" --query '[0].name' -o tsv)
          FD=$(az afd endpoint list --profile-name "$FD_PROFILE" -g "rg-motion-forge-prod" --query '[0].hostName' -o tsv)
          {
            echo "fd=${FD}"
            echo "url=https://${FD}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## motion · prod deploy"
            echo "* Image tag: \`${IMAGE_TAG}\`"
            echo "* Front Door: https://${FD}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # Post-deploy smoke (prod) — three checks, all gating:
      #   1. /healthz                          → API is up
      #   2. Keycloak token-endpoint round-trip → IdP is live + creds valid
      #   3. /v1/themes with the token         → auth-middleware respects JWT
      # Secrets KEYCLOAK_SMOKE_USER / _PASS / _CLIENT_ID / _URL live in the
      # `prod` environment scope.
      # ----------------------------------------------------------------------
      - name: Post-deploy smoke (prod)
        env:
          FD: ${{ steps.summary.outputs.fd }}
          KC_URL:        ${{ secrets.KEYCLOAK_URL }}
          KC_REALM:      ${{ secrets.KEYCLOAK_REALM }}
          KC_CLIENT_ID:  ${{ secrets.KEYCLOAK_SMOKE_CLIENT_ID }}
          KC_USER:       ${{ secrets.KEYCLOAK_SMOKE_USER }}
          KC_PASS:       ${{ secrets.KEYCLOAK_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=== 1/3 healthz ==="
          for _i in $(seq 1 30); do
            if curl -sf "https://${FD}/healthz" >/dev/null; then
              echo "ok"; break
            fi
            sleep 5
          done
          curl -sf "https://${FD}/healthz" >/dev/null

          echo "=== 2/3 Keycloak token ==="
          TOKEN=$(curl -sf \
            -d "grant_type=password" \
            -d "client_id=${KC_CLIENT_ID}" \
            -d "username=${KC_USER}" \
            -d "password=${KC_PASS}" \
            "${KC_URL}/realms/${KC_REALM}/protocol/openid-connect/token" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          if [[ -z "${TOKEN}" ]]; then
            echo "::error::Keycloak token request returned empty access_token"
            exit 1
          fi
          echo "token acquired (${#TOKEN} chars)"

          echo "=== 3/3 /v1/themes with token ==="
          STATUS=$(curl -s -o /tmp/themes.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://${FD}/v1/themes")
          if [[ "${STATUS}" != "200" ]]; then
            echo "::error::/v1/themes returned ${STATUS}"
            head -c 500 /tmp/themes.json || true
            exit 1
          fi
          echo "ok — /v1/themes returned 200"
