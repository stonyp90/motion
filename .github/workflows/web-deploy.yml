name: web · deploy (vercel · superseded)

# SUPERSEDED 2026-05-26: web hosting moved to Azure Container Apps to
# consolidate the SOC 2 vendor pack onto a single provider. The active
# workflow is `.github/workflows/web-deploy-azure.yml`.
#
# This file is kept for two reasons:
#   1. It still serves as documentation of the Vercel deploy contract
#      if we ever need to re-enable it (e.g. for an emergency rollback).
#   2. Removing it entirely would surprise anyone watching the repo's
#      Actions tab — a clearly-labelled "superseded" file is louder.
#
# The triggers are stripped down to `workflow_dispatch` only, so the
# workflow never fires automatically. To re-enable: restore the
# `push` + `pull_request` blocks below and disable web-deploy-azure.yml.

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write    # post the preview URL as a PR comment

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'push' && 'prod' || 'preview' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel secrets not set; skipping deploy. See web-deploy.yml header for the required secret names."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: '22'

      - name: Install Vercel CLI
        if: steps.check.outputs.skip != 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel project config
        if: steps.check.outputs.skip != 'true'
        run: |
          vercel pull \
            --yes \
            --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} \
            --token=$VERCEL_TOKEN

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: |
          vercel build \
            ${{ github.event_name == 'push' && '--prod' || '' }} \
            --token=$VERCEL_TOKEN

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          else
            URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🚀 Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: steps.check.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 **ControlCraft preview**: ${{ steps.deploy.outputs.url }}`,
            });
