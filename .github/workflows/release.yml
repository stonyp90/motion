name: release

# Tag-triggered, cargo-dist style multi-platform release pipeline for the
# `motion-forge` CLI binary. Produces:
#
#   * Pre-built archives for { macOS arm64/x86_64, Linux arm64/x86_64,
#     Windows x86_64 }
#   * SHA256SUMS manifest
#   * Sigstore-cosign keyless signatures (.sig + .pem certificate) over
#     every archive and the manifest
#   * SLSA 3 provenance attestation (one per artifact) generated by the
#     official slsa-framework reusable workflow
#
# Trigger: push tag matching `v*.*.*` (e.g. v0.1.0, v1.2.3-rc1).
#
# This workflow is structured to mirror what `cargo dist generate-ci` emits
# while staying hand-edit-friendly so we can fold in motion-specific bits
# (ffmpeg, themes/ assets) without losing them on the next `cargo dist`
# regeneration.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write    # create release + upload assets
  id-token: write    # cosign keyless + SLSA OIDC
  attestations: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: motion-forge

jobs:
  # --------------------------------------------------------------------------
  # Resolve the tag once so subsequent jobs share it.
  # --------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag:     ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "tag=${TAG}"     >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Cross-platform build matrix. Each runner cross-compiles to its native
  # target (no QEMU) for speed + reliability — mac arm64 uses the M-series
  # runner directly.
  # --------------------------------------------------------------------------
  build:
    name: build · ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            ext: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: tar.gz
            ext: ''
          - target: x86_64-apple-darwin
            runner: macos-15-intel  # Intel runner
            archive: tar.gz
            ext: ''
          - target: aarch64-apple-darwin
            runner: macos-14      # Apple Silicon runner
            archive: tar.gz
            ext: ''
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            ext: .exe
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v6

      - name: Install ffmpeg (linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: startsWith(matrix.runner, 'macos')
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: matrix.runner == 'windows-latest'
        shell: bash
        run: choco install ffmpeg -y --no-progress

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build -p motion-forge-cli --release --target ${{ matrix.target }}

      - name: Package archive
        id: pkg
        shell: bash
        run: |
          VER="${{ needs.plan.outputs.version }}"
          NAME="${BIN_NAME}-${VER}-${{ matrix.target }}"
          STAGE="dist/${NAME}"
          mkdir -p "${STAGE}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}" "${STAGE}/"
          # Bundle the readme + license alongside the binary so the
          # archive is self-explanatory.
          cp ../README.md           "${STAGE}/" 2>/dev/null || true
          cp ../LICENSE*            "${STAGE}/" 2>/dev/null || true

          cd dist
          if [[ "${{ matrix.archive }}" == "tar.gz" ]]; then
            tar -czf "${NAME}.tar.gz" "${NAME}"
            ARCHIVE="${NAME}.tar.gz"
          else
            # 7z on Windows runners; fallback to PowerShell Compress-Archive
            if command -v 7z >/dev/null 2>&1; then
              7z a "${NAME}.zip" "${NAME}" >/dev/null
            else
              powershell -Command "Compress-Archive -Path '${NAME}' -DestinationPath '${NAME}.zip'"
            fi
            ARCHIVE="${NAME}.zip"
          fi
          # SHA256 of the archive (used in SHA256SUMS aggregation).
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}"        >> "$GITHUB_OUTPUT"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            engine/dist/*.tar.gz
            engine/dist/*.zip
            engine/dist/*.sha256
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Aggregate SHA256SUMS across all platforms (used for cosign + provenance).
  # --------------------------------------------------------------------------
  checksums:
    name: aggregate SHA256SUMS
    needs: [plan, build]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.gen.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - id: gen
        run: |
          cd dist
          # Combined manifest of every archive
          rm -f SHA256SUMS
          for f in *.tar.gz *.zip; do
            [[ -f "$f" ]] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS
          # SLSA provenance needs a base64-encoded hash list (per the
          # generic generator's contract).
          HASHES=$(base64 -w0 < SHA256SUMS)
          echo "hashes=${HASHES}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS
          retention-days: 7

  # --------------------------------------------------------------------------
  # Sigstore keyless signing — cosign signs each archive + SHA256SUMS using
  # the workflow's OIDC identity. Produces .sig + .pem next to every file.
  # --------------------------------------------------------------------------
  sign:
    name: cosign sign (keyless)
    needs: [plan, build, checksums]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign archives + SHA256SUMS
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cd dist
          for f in *.tar.gz *.zip SHA256SUMS; do
            [[ -f "$f" ]] || continue
            echo "::group::cosign $f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
            echo "::endgroup::"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: cosign-signatures
          path: |
            dist/*.sig
            dist/*.pem
          retention-days: 7

  # --------------------------------------------------------------------------
  # SLSA 3 provenance via the official reusable workflow. Generates one
  # provenance.intoto.jsonl that covers every archive in `hashes`.
  # --------------------------------------------------------------------------
  provenance:
    name: SLSA 3 provenance
    needs: [build, checksums]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.checksums.outputs.hashes }}
      upload-assets: false # we attach to the GH release ourselves below

  # --------------------------------------------------------------------------
  # Publish the GitHub release with every archive, signatures, and the
  # provenance bundle.
  # --------------------------------------------------------------------------
  publish:
    name: publish GitHub release
    needs: [plan, build, checksums, sign, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: cosign-signatures
          path: dist

      - name: Download SLSA provenance
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.plan.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/*.sig
            dist/*.pem
            dist/*.intoto.jsonl
