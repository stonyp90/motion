name: desktop · release

# IMTN desktop release pipeline — cross-platform Tauri 2 builds.
#
# Triggers:
#   - Push of a tag matching `desktop-v*.*.*` (canonical release).
#   - workflow_dispatch with a `tag` input (manual re-builds + drafts).
#
# Matrix:
#   - macos-latest        → aarch64-apple-darwin    (Apple silicon)
#   - macos-13            → x86_64-apple-darwin     (Intel)
#   - windows-latest      → x86_64-pc-windows-msvc  (x64)
#   - ubuntu-22.04        → x86_64-unknown-linux-gnu
#
# Outputs (uploaded to a GitHub Release):
#   - macOS:   *.dmg  + IMTN.app inside Resources/macos/
#   - Windows: *.msi  + *.nsis.exe
#   - Linux:   *.AppImage + *.deb
#
# Code-signing + macOS notarisation are wired but skipped when the
# secrets aren't set (so a fresh fork can build unsigned binaries).
#
# Engine + Ollama sidecars are NOT bundled in this v0 release; the
# Tauri shell's spawn_engine() + spawn_ollama_if_absent() fall back to
# a PATH lookup. Folding the engine binary in is a follow-up once we
# have a portable Python story for the segmentation + render sidecars.

on:
  push:
    tags:
      - 'desktop-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. desktop-v0.1.0). Created if absent.'
        required: true
        default: 'desktop-v0.0.0-test'

# Single canonical release artifact bucket across all matrix legs.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write       # create + upload release assets
  id-token: write       # future: cosign / SLSA attest

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS · arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
          - label: macOS · x86_64
            os: macos-13
            target: x86_64-apple-darwin
            bundles: dmg,app
          - label: Windows · x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - label: Linux · x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # ----- Toolchain ---------------------------------------------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      # ----- Linux deps (Tauri 2 on Ubuntu wants webkit2gtk-4.1, ayatana) -----
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install npm deps (desktop/)
        working-directory: desktop
        run: npm ci

      # ----- Build + bundle via tauri-action ----------------------------------
      # tauri-action is the canonical CI wrapper. It runs `tauri build`,
      # picks up our tauri.conf.json, and uploads the produced installers
      # to the GitHub Release named by `releaseId`.
      # Pre-flight diagnostic — confirms the toolchain + Tauri CLI
      # are reachable so silent failures are easy to tell apart from
      # a true build error.
      - name: Tauri CLI version (pre-flight)
        working-directory: desktop
        shell: bash
        run: |
          npx tauri --version
          rustc --version
          cargo --version
          echo "Targets installed:"
          rustup target list --installed

      # Build directly via the Tauri CLI so the real cargo output
      # reaches the GH log (the tauri-action wrapper was swallowing
      # errors in 100ms with "No artifacts were found", giving us
      # nothing to debug).
      - name: Build IMTN desktop (${{ matrix.target }})
        working-directory: desktop
        shell: bash
        env:
          # Tauri Updater signing — gracefully no-ops when empty.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # macOS code-signing — only enter this block when the
          # APPLE_CERTIFICATE secret is actually populated. Passing
          # an empty string up to Tauri triggers `security import`
          # against an empty file, which fails the whole bundle.
          # Linux + Windows skip the block entirely.
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "::group::macOS code-signing enabled"
            export APPLE_CERTIFICATE="${{ secrets.APPLE_CERTIFICATE }}"
            export APPLE_CERTIFICATE_PASSWORD="${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            export APPLE_SIGNING_IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_PASSWORD="${{ secrets.APPLE_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
            echo "::endgroup::"
          else
            echo "::notice::APPLE_CERTIFICATE secret not set — building unsigned. Users will see a Gatekeeper warning on first launch; right-click → Open to bypass."
          fi
          npx tauri build \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.bundles }} \
            --verbose

      # ----- Smoke: list whatever did land ------------------------------------
      - name: List build outputs
        if: always()
        shell: bash
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "----- $BUNDLE_DIR -----"
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f -name 'IMTN*' -o -name 'imtn*' | head -20
            echo "----- total size -----"
            du -sh "$BUNDLE_DIR" || true
          else
            echo "(no bundle directory)"
          fi

      # ----- Upload to GitHub Release -----------------------------------------
      # Manual upload so the build + the upload are two distinct steps.
      # Picks up dmg/msi/exe/AppImage/deb files only — skips the .app
      # directory + intermediates.
      - name: Upload installers to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: 'IMTN Desktop ${{ steps.tag.outputs.value }}'
          draft: true
          prerelease: false
          generate_release_notes: false
          body: |
            ## IMTN Desktop — ${{ steps.tag.outputs.value }}

            Cross-platform native shell for IMTN. Runs the engine + Ollama
            locally so generation never leaves your machine.

            ### Downloads

            Pick the build for your platform. macOS users grab
            **`*_aarch64.dmg`** for Apple silicon or **`*_x64.dmg`** for Intel.

            ### Local model requirement

            Ollama isn't bundled yet — install it once from
            <https://ollama.com/download>, then run `ollama pull llava`
            so the desktop can talk to a vision model on first launch.

            See `desktop/README.md` for the full workflow.
          files: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
