name: desktop · release

# ControlCraft desktop release pipeline — cross-platform Tauri 2 builds.
#
# Triggers:
#   - Push of a tag matching `desktop-v*.*.*` (canonical release).
#   - workflow_dispatch with a `tag` input (manual re-builds + drafts).
#
# Matrix:
#   - macos-latest        → aarch64-apple-darwin    (Apple silicon)
#   - macos-13            → x86_64-apple-darwin     (Intel)
#   - windows-latest      → x86_64-pc-windows-msvc  (x64)
#   - ubuntu-22.04        → x86_64-unknown-linux-gnu
#
# Outputs (uploaded to a GitHub Release):
#   - macOS:   *.dmg  + ControlCraft.app inside Resources/macos/
#   - Windows: *.msi  + *.nsis.exe
#   - Linux:   *.AppImage + *.deb
#
# Code-signing + macOS notarisation are wired but skipped when the
# secrets aren't set (so a fresh fork can build unsigned binaries).
#
# Ollama is bundled as a Tauri `externalBin` sidecar (see
# desktop/scripts/fetch-ollama.sh + desktop/ollama-pins.json). The
# fetch step below stages the right binary per matrix leg into
# desktop/src-tauri/binaries/ before `tauri build` co-signs it.
#
# Engine sidecar (`motion-forge`) is built from the engine/ workspace
# in the matching matrix target and bundled via Tauri externalBin —
# see "Build engine sidecar" step below. The engine binary alone gets
# the desktop client to the empty-state Studio + zero-render exports
# (Lottie / dotLottie / SVG). Raster + video formats also need a
# Python venv (lottie+cairo) at runtime, which is NOT shipped — the
# engine surfaces a clear "python interpreter not found" error and
# desktop/README.md documents `scripts/setup-python.sh` as a one-time
# prereq. Removing this prereq lands in a follow-up (dotlottie-rs
# rasterizer replacing python-lottie).

on:
  push:
    tags:
      - 'desktop-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. desktop-v0.1.0). Created if absent.'
        required: true
        default: 'desktop-v0.0.0-test'

# Single canonical release artifact bucket across all matrix legs.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write       # create + upload release assets
  id-token: write       # future: cosign / SLSA attest

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS · arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
          - label: macOS · x86_64
            os: macos-13
            target: x86_64-apple-darwin
            bundles: dmg,app
          - label: Windows · x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - label: Linux · x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # ----- Toolchain ---------------------------------------------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache both Cargo workspaces touched by this job: the Tauri
          # shell (desktop/src-tauri) and the engine sidecar (engine/).
          # `key` is per-target so a Mac-arm cache never feeds a Linux
          # job; `cache-on-failure` keeps a partial cache around so a
          # half-broken release tag's next attempt isn't a cold build.
          workspaces: |
            desktop/src-tauri -> target
            engine -> target
          key: ${{ matrix.target }}
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      # ----- Linux deps (Tauri 2 on Ubuntu wants webkit2gtk-4.1, ayatana) -----
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install npm deps (desktop/)
        working-directory: desktop
        run: npm ci

      # ----- Stage Ollama sidecar ---------------------------------------------
      # Reads desktop/ollama-pins.json, downloads the matching release
      # asset from github.com/ollama/ollama/releases, verifies SHA-256,
      # and drops the binary into desktop/src-tauri/binaries/ with the
      # filename Tauri's externalBin resolution expects.
      - name: Stage Ollama sidecar (${{ matrix.target }})
        working-directory: desktop
        shell: bash
        run: scripts/fetch-ollama.sh ${{ matrix.target }}

      # ----- Build + stage the engine sidecar (motion-forge) -----------------
      # Tauri externalBin convention: the binary lives at
      # desktop/src-tauri/binaries/motion-forge-<target>(.exe) and gets
      # renamed to motion-forge(.exe) next to the app bundle at build
      # time. The Tauri shell's `sibling_binary("motion-forge")` lookup
      # (see desktop/src-tauri/src/lib.rs) then resolves it at runtime.
      - name: Build engine sidecar (${{ matrix.target }})
        working-directory: engine
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} --bin motion-forge
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            cp "target/${{ matrix.target }}/release/motion-forge.exe" \
               "../desktop/src-tauri/binaries/motion-forge-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/motion-forge" \
               "../desktop/src-tauri/binaries/motion-forge-${{ matrix.target }}"
          fi
          ls -la "../desktop/src-tauri/binaries/" | grep motion-forge

      # ----- Build + bundle via tauri-action ----------------------------------
      # tauri-action is the canonical CI wrapper. It runs `tauri build`,
      # picks up our tauri.conf.json, and uploads the produced installers
      # to the GitHub Release named by `releaseId`.
      # Pre-flight diagnostic — confirms the toolchain + Tauri CLI
      # are reachable so silent failures are easy to tell apart from
      # a true build error.
      - name: Tauri CLI version (pre-flight)
        working-directory: desktop
        shell: bash
        run: |
          npx tauri --version
          rustc --version
          cargo --version
          echo "Targets installed:"
          rustup target list --installed

      # Build directly via the Tauri CLI so the real cargo output
      # reaches the GH log (the tauri-action wrapper was swallowing
      # errors in 100ms with "No artifacts were found", giving us
      # nothing to debug).
      - name: Build ControlCraft desktop (${{ matrix.target }})
        working-directory: desktop
        shell: bash
        env:
          # Tauri Updater signing — gracefully no-ops when empty.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # macOS code-signing — only enter this block when the
          # APPLE_CERTIFICATE secret is actually populated. Passing
          # an empty string up to Tauri triggers `security import`
          # against an empty file, which fails the whole bundle.
          # Linux + Windows skip the block entirely.
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "::group::macOS code-signing enabled"
            export APPLE_CERTIFICATE="${{ secrets.APPLE_CERTIFICATE }}"
            export APPLE_CERTIFICATE_PASSWORD="${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            export APPLE_SIGNING_IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_PASSWORD="${{ secrets.APPLE_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
            echo "::endgroup::"
          else
            echo "::notice::APPLE_CERTIFICATE secret not set — building unsigned. Users will see a Gatekeeper warning on first launch; right-click → Open to bypass."
          fi
          npx tauri build \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.bundles }} \
            --verbose

      # ----- Smoke: list whatever did land ------------------------------------
      - name: List build outputs
        if: always()
        shell: bash
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "----- $BUNDLE_DIR -----"
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \( -name 'ControlCraft*' -o -name 'controlcraft*' \) | head -20
            echo "----- .sig files -----"
            find "$BUNDLE_DIR" -type f -name '*.sig' | head -10
            echo "----- total size -----"
            du -sh "$BUNDLE_DIR" || true
          else
            echo "(no bundle directory)"
          fi

      # ----- Stage updater manifest fragment for this matrix leg --------------
      # The Tauri bundler emits a `.sig` file next to each updater artifact
      # (it's a minisign signature over the file's contents, signed with
      # TAURI_SIGNING_PRIVATE_KEY). We pick the right one per platform and
      # write a tiny JSON fragment that the `merge-manifest` job picks up
      # at the end to assemble the final updater manifest.
      - name: Stage updater manifest fragment
        if: success()
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          PLATFORM=""
          ASSET=""
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)        PLATFORM="darwin-aarch64";   ASSET=$(find "$BUNDLE_DIR" -name '*.app.tar.gz' | head -1);;
            x86_64-apple-darwin)         PLATFORM="darwin-x86_64";    ASSET=$(find "$BUNDLE_DIR" -name '*.app.tar.gz' | head -1);;
            x86_64-pc-windows-msvc)      PLATFORM="windows-x86_64";   ASSET=$(find "$BUNDLE_DIR" -name '*.nsis.zip' -o -name '*.msi.zip' | head -1);;
            x86_64-unknown-linux-gnu)    PLATFORM="linux-x86_64";     ASSET=$(find "$BUNDLE_DIR" -name '*.AppImage.tar.gz' | head -1);;
          esac
          if [ -z "$ASSET" ] || [ ! -f "${ASSET}.sig" ]; then
            echo "::warning::No signed updater artifact for ${{ matrix.target }} — skipping manifest fragment."
            exit 0
          fi
          SIG=$(cat "${ASSET}.sig")
          BASENAME=$(basename "$ASSET")
          VERSION=$(echo "$TAG" | sed 's/^desktop-v//')
          # GitHub Release asset URL pattern: github.com/<owner>/<repo>/releases/download/<tag>/<filename>
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${BASENAME}"
          mkdir -p .updater-fragments
          cat > ".updater-fragments/${PLATFORM}.json" <<EOF
          {
            "version": "${VERSION}",
            "platform": "${PLATFORM}",
            "url": "${URL}",
            "signature": $(echo "$SIG" | jq -Rs .)
          }
          EOF
          echo "Wrote .updater-fragments/${PLATFORM}.json"

      - name: Upload updater fragment
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-${{ matrix.target }}
          path: .updater-fragments/*.json
          if-no-files-found: ignore
          retention-days: 7

      # ----- Upload to GitHub Release -----------------------------------------
      # Manual upload so the build + the upload are two distinct steps.
      # Picks up dmg/msi/exe/AppImage/deb files only — skips the .app
      # directory + intermediates.
      - name: Upload installers to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: 'ControlCraft Desktop ${{ steps.tag.outputs.value }}'
          draft: true
          prerelease: false
          generate_release_notes: false
          body: |
            ## ControlCraft Desktop — ${{ steps.tag.outputs.value }}

            Cross-platform native shell for ControlCraft. Runs the engine + Ollama
            locally so generation never leaves your machine.

            ### Downloads

            Pick the build for your platform. macOS users grab
            **`*_aarch64.dmg`** for Apple silicon or **`*_x64.dmg`** for Intel.

            ### Local model

            Ollama ships embedded in the installer — no separate
            download. On first launch, ControlCraft picks a vision
            model that fits your machine (hardware-detected) and
            streams the download from Ollama's registry with a
            progress bar. About 4–8 GB depending on tier.

            See `desktop/README.md` for the full workflow.
          files: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.nsis.zip
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi.zip
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  # ──────────────────────────────────────────────────────────────────────
  # Manifest assembly — runs once after all 4 matrix legs.
  # Pulls every leg's `updater-fragment-*` artifact, merges them into one
  # JSON document at web/public/desktop-updates/manifest.json, and pushes
  # the change back to main. The Next.js updater route (api/updater/...)
  # reads from this file at runtime; auto-update goes live the moment
  # this commit ships.
  # ──────────────────────────────────────────────────────────────────────
  merge-manifest:
    name: Merge updater manifest
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the actual ref (main) so the push lands somewhere useful.
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull all updater fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-fragment-*
          path: .updater-fragments
          merge-multiple: true

      - name: Assemble manifest
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          VERSION=$(echo "$TAG" | sed 's/^desktop-v//')
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES="ControlCraft Desktop ${TAG} — see https://github.com/${{ github.repository }}/releases/tag/${TAG} for the changelog."
          # Each fragment is one platform; build a `platforms` map keyed
          # on the Tauri target string the updater plugin sends us.
          PLATFORMS=$(jq -s '
            map({(.platform): {url: .url, signature: .signature}})
            | add
          ' .updater-fragments/*.json)
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{
              "$schema": "Tauri 2 updater manifest. Owned by .github/workflows/desktop-release.yml — CI rewrites this file on every desktop-v* tag.",
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: $platforms
            }' > web/public/desktop-updates/manifest.json
          echo "----- manifest -----"
          cat web/public/desktop-updates/manifest.json

      - name: Commit + push manifest
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet web/public/desktop-updates/manifest.json; then
            echo "(manifest unchanged — nothing to push)"
            exit 0
          fi
          git add web/public/desktop-updates/manifest.json
          git commit -m "chore(desktop): publish updater manifest for ${TAG}"
          git push origin main
