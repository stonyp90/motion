name: desktop · release

# IMTN desktop release pipeline — cross-platform Tauri 2 builds.
#
# Triggers:
#   - Push of a tag matching `desktop-v*.*.*` (canonical release).
#   - workflow_dispatch with a `tag` input (manual re-builds + drafts).
#
# Matrix:
#   - macos-latest        → aarch64-apple-darwin    (Apple silicon)
#   - macos-13            → x86_64-apple-darwin     (Intel)
#   - windows-latest      → x86_64-pc-windows-msvc  (x64)
#   - ubuntu-22.04        → x86_64-unknown-linux-gnu
#
# Outputs (uploaded to a GitHub Release):
#   - macOS:   *.dmg  + IMTN.app inside Resources/macos/
#   - Windows: *.msi  + *.nsis.exe
#   - Linux:   *.AppImage + *.deb
#
# Code-signing + macOS notarisation are wired but skipped when the
# secrets aren't set (so a fresh fork can build unsigned binaries).
#
# Engine + Ollama sidecars are NOT bundled in this v0 release; the
# Tauri shell's spawn_engine() + spawn_ollama_if_absent() fall back to
# a PATH lookup. Folding the engine binary in is a follow-up once we
# have a portable Python story for the segmentation + render sidecars.

on:
  push:
    tags:
      - 'desktop-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. desktop-v0.1.0). Created if absent.'
        required: true
        default: 'desktop-v0.0.0-test'

# Single canonical release artifact bucket across all matrix legs.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write       # create + upload release assets
  id-token: write       # future: cosign / SLSA attest

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS · arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
          - label: macOS · x86_64
            os: macos-13
            target: x86_64-apple-darwin
            bundles: dmg,app
          - label: Windows · x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - label: Linux · x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # ----- Toolchain ---------------------------------------------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      # ----- Linux deps (Tauri 2 on Ubuntu wants webkit2gtk-4.1, ayatana) -----
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install npm deps (desktop/)
        working-directory: desktop
        run: npm ci

      # ----- Build + bundle via tauri-action ----------------------------------
      # tauri-action is the canonical CI wrapper. It runs `tauri build`,
      # picks up our tauri.conf.json, and uploads the produced installers
      # to the GitHub Release named by `releaseId`.
      - name: Build IMTN desktop (${{ matrix.target }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing — skipped when the secret is empty.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri Updater signature — keypair generated via
          # `tauri signer generate`; pubkey lives in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ steps.tag.outputs.value }}
          releaseName: 'IMTN Desktop ${{ steps.tag.outputs.value }}'
          releaseBody: |
            ## IMTN Desktop — ${{ steps.tag.outputs.value }}

            Cross-platform native shell for IMTN. Runs the engine + Ollama
            locally so generation never leaves your machine.

            ### Downloads

            Pick the build for your platform below. macOS users should grab
            **`*_aarch64.dmg`** for Apple silicon or **`*_x64.dmg`** for Intel.

            ### Local model requirement

            Ollama isn't bundled yet — install it once from
            <https://ollama.com/download>, then run `ollama pull llava` so
            the desktop can talk to a vision model on first launch.

            See `desktop/README.md` for the full workflow.
          releaseDraft: true       # cuts a draft so we can curate the body
          prerelease: false
          includeRelease: false    # only this run's assets, not prior
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # ----- Smoke: verify a binary actually landed ---------------------------
      - name: List build outputs
        if: always()
        shell: bash
        run: |
          echo "----- desktop/src-tauri/target/${{ matrix.target }}/release/bundle -----"
          ls -la desktop/src-tauri/target/${{ matrix.target }}/release/bundle/ 2>/dev/null || \
            echo "(no bundle directory — build likely failed; see job log above)"
