name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # for code-scanning result uploads
  actions: read

jobs:
  cargo-audit:
    name: cargo audit (Rust engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  npm-audit:
    name: npm audit (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate --omit=dev

  trivy-image:
    name: Trivy (container image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image locally for scan
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file engine/infra/docker/Dockerfile.api \
            --tag motion-forge-api:scan \
            --load \
            engine
      - name: Trivy scan
        # All trivy-action tags are `v`-prefixed in source control.
        # The earlier un-prefixed `@0.24.0` worked by historical accident
        # (a yanked legacy tag); current versions need the `v`.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: motion-forge-api:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        # SARIF upload only works once "Code scanning" is enabled in
        # repo settings (Settings → Code security and analysis). Until
        # then this step would fail with "Code scanning is not enabled".
        # Best-effort so the job's pass/fail reflects the scan itself,
        # not the upload pipe.
        continue-on-error: true
        if: always()
        with:
          sarif_file: trivy-results.sarif

  codeql:
    name: CodeQL
    # CodeQL requires "Code scanning" to be enabled in repo settings
    # (Settings → Code security and analysis → Code scanning → Set up).
    # Until that toggle is on the analyze step returns:
    #   "Code scanning is not enabled for this repository"
    # We mark the job as continue-on-error so the workflow as a whole
    # stays green; the run still shows up amber to nudge the maintainer
    # to flip the setting.
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license for private
      # repositories (see gitleaks.io/products.html). The scanner
      # binary itself is MIT-licensed and free — invoke it directly
      # so secret scanning works on private repos without a license.
      - name: Install gitleaks CLI
        run: |
          GL_VERSION=8.21.2
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repo for secrets
        run: gitleaks detect --no-banner --redact --verbose --exit-code 1
