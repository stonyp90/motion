version: 2

updates:
  # Rust workspace
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, rust]
    commit-message:
      prefix: "deps(engine)"

  # Node / Next web
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      next-ecosystem:
        patterns: ["next", "react", "react-dom", "@next/*", "eslint-config-next"]
      types:
        patterns: ["@types/*"]
      minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["next", "react", "react-dom", "@next/*"]
    labels: [dependencies, web]
    commit-message:
      prefix: "deps(web)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "deps(ci)"

  # Docker base images
  - package-ecosystem: docker
    directory: /engine/infra/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(docker)"
