version: 2

# Dependabot — weekly cadence across all four ecosystems: cargo, npm,
# docker, github-actions. Verified for W25:
#   * /engine               → cargo workspace
#   * /web                  → next/react npm app
#   * /engine/infra/docker  → Dockerfile.api / .render / .segment base images
#   * /                     → github-actions referenced from .github/workflows
updates:
  # Rust workspace
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, rust]
    commit-message:
      prefix: "deps(engine)"

  # Node / Next web
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      next-ecosystem:
        patterns: ["next", "react", "react-dom", "@next/*", "eslint-config-next"]
      types:
        patterns: ["@types/*"]
      minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["next", "react", "react-dom", "@next/*"]
    labels: [dependencies, web]
    commit-message:
      prefix: "deps(web)"

  # GitHub Actions (every workflow under .github/workflows/)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, ci]
    commit-message:
      prefix: "deps(ci)"

  # Docker base images
  - package-ecosystem: docker
    directory: /engine/infra/docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(docker)"
