[package]
name = "imtn"
version = "0.1.0"
description = "IMTN desktop shell — wraps the motion-forge web app and runs the engine + Ollama as local sidecars"
authors = ["motion-forge"]
license = "Apache-2.0"
repository = "https://github.com/stonyp90/motion-forge"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "imtn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
