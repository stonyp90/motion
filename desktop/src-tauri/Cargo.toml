[package]
name = "controlcraft"
version = "0.1.0"
description = "ControlCraft desktop shell — wraps the motion-forge web app and runs the engine + Ollama as local sidecars"
authors = ["motion-forge"]
license = "Apache-2.0"
repository = "https://github.com/stonyp90/motion-forge"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "controlcraft_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
# tauri-plugin-updater wires the auto-update flow. The plugin checks
# `endpoints` from tauri.conf.json on app startup; if a newer version
# is published it downloads, verifies the signature against `pubkey`,
# and installs. Signing key is `TAURI_SIGNING_PRIVATE_KEY` (already
# in GH secrets); generated artifacts get `.sig` siblings in CI.
tauri-plugin-updater = "2"
# Relaunch-after-update support. The updater plugin downloads + verifies
# the new bundle; this plugin restarts the running process so the user
# is back in the new build without having to quit + reopen manually.
tauri-plugin-process = "2"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
# Hardware probe for the first-launch wizard's model picker. `sysinfo`
# covers RAM + CPU + a coarse GPU read; we don't need exact VRAM, only
# the brackets that setup::pick_model distinguishes.
sysinfo = "0.32"
# Native HTTP client for talking to the local Ollama daemon (`/api/tags`,
# `/api/pull` NDJSON stream). `rustls-tls` keeps us off OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
