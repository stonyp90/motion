name: engine · Azure deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment (dev / prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
      image_tag:
        description: 'Image tag (defaults to commit SHA)'
        required: false
  push:
    branches: [main]
    paths:
      - 'engine/crates/**'
      - 'engine/scripts/**'
      - 'engine/themes/**'
      - 'engine/infra/**'
      - 'engine/Cargo.toml'
      - 'engine/Cargo.lock'
      - '.github/workflows/azure-deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  ENV: ${{ github.event.inputs.env || 'dev' }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve RG + ACR
        id: discover
        run: |
          RG="rg-motion-forge-${ENV}"
          ACR=$(az acr list --resource-group "${RG}" --query "[0].name" -o tsv)
          if [[ -z "${ACR}" ]]; then
            echo "no ACR in ${RG}; bootstrap with: cd engine/infra && ./deploy.sh --env ${ENV}" >&2
            exit 1
          fi
          echo "rg=${RG}"   >> "$GITHUB_OUTPUT"
          echo "acr=${ACR}" >> "$GITHUB_OUTPUT"

      - name: Build + push images via ACR Build (no local Docker needed)
        run: |
          # API image (Rust) — slow build, ~6 min on ACR
          az acr build --registry ${{ steps.discover.outputs.acr }} \
            --image "motion-forge-api:${IMAGE_TAG}" \
            --image "motion-forge-api:latest" \
            --file engine/infra/docker/Dockerfile.api \
            --platform linux/amd64 \
            engine
          # Render job (Python + Lottie). Skip the segment image when
          # enableGpuProfile=false on the target env.
          az acr build --registry ${{ steps.discover.outputs.acr }} \
            --image "motion-forge-render:${IMAGE_TAG}" \
            --image "motion-forge-render:latest" \
            --file engine/infra/docker/Dockerfile.render \
            --platform linux/amd64 \
            engine

      - name: Apply Bicep
        run: |
          az deployment group create \
            --resource-group "${{ steps.discover.outputs.rg }}" \
            --template-file engine/infra/main.bicep \
            --parameters "engine/infra/parameters.${ENV}.bicepparam" \
            --parameters "apiImageTag=${IMAGE_TAG}" "renderImageTag=${IMAGE_TAG}" \
            --query "properties.provisioningState" -o tsv

      - name: Print Front Door endpoint
        run: |
          FD_PROFILE=$(az afd profile list -g "${{ steps.discover.outputs.rg }}" --query '[0].name' -o tsv)
          FD=$(az afd endpoint list --profile-name "$FD_PROFILE" -g "${{ steps.discover.outputs.rg }}" --query '[0].hostName' -o tsv)
          echo "## motion · ${ENV} deploy"      >> $GITHUB_STEP_SUMMARY
          echo "* Image tag: \`${IMAGE_TAG}\`"  >> $GITHUB_STEP_SUMMARY
          echo "* Front Door: https://${FD}"    >> $GITHUB_STEP_SUMMARY
          echo ""                               >> $GITHUB_STEP_SUMMARY
          echo "Verify: \`curl https://${FD}/healthz\`" >> $GITHUB_STEP_SUMMARY
