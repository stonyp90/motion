[package]
name = "motion-forge-ingest"
description = "Unified ingestion adapters for Lottie/Bodymovin/DotLottie/Rive/DragonBones/MoGRT into motion-forge's internal Composition."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
motion-forge-prompt-orchestrator.workspace = true
motion-forge-style-extract.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Stable zip; .lottie + .mogrt are both zip containers.
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
