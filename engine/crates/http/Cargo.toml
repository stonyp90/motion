[package]
name = "motion-forge-http"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
motion-forge-pipeline.workspace = true
motion-forge-prompt-orchestrator.workspace = true
motion-forge-render.workspace = true
motion-forge-style-extract.workspace = true
motion-forge-lottie-gen.workspace = true
motion-forge-image-gen.workspace = true
motion-forge-stt.workspace = true
motion-forge-figma.workspace = true
motion-forge-ingest.workspace = true
motion-forge-video-io.workspace = true
motion-forge-web-export.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.7", features = ["multipart", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
futures-util = "0.3"
async-stream = "0.3"
jsonwebtoken = "9"
reqwest = { workspace = true }
http = "1"
tempfile = "3"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
sha2 = "0.10"
rand = "0.8"
dashmap = "6"
async-trait = "0.1"
# ACS email signing — HMAC-SHA256, base64-encoded.
hmac = "0.12"
base64 = "0.22"
# RFC 7231 date format for the x-ms-date header.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking"] }
tokio = { workspace = true, features = ["test-util", "macros"] }
