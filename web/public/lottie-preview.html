<!doctype html><meta charset=utf-8><title>Brand sample preview</title>
<style>body{margin:0;background:#0e1014;color:#fff;font-family:system-ui}main{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}figure{margin:0;background:#1a1e25;border-radius:12px;overflow:hidden}figcaption{padding:8px 12px;font-size:12px;color:#999}.lottie-wrap{aspect-ratio:16/9}</style>
<main>
  <figure><div class=lottie-wrap><lottie-player src=/lottie/corporate.json autoplay loop style="width:100%;height:100%"></lottie-player></div><figcaption>corporate</figcaption></figure>
  <figure><div class=lottie-wrap><lottie-player src=/lottie/playful.json autoplay loop style="width:100%;height:100%"></lottie-player></div><figcaption>playful</figcaption></figure>
  <figure><div class=lottie-wrap><lottie-player src=/lottie/minimalist.json autoplay loop style="width:100%;height:100%"></lottie-player></div><figcaption>minimalist</figcaption></figure>
</main>
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
